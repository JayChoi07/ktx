name: pages

# docs/ (설치 안내 페이지)를 gh-pages 브랜치로 밀어 GitHub Pages 로 배포한다.
# actions/configure-pages 의 자동 활성화는 GITHUB_TOKEN 권한 문제로 실패해서, 브랜치 배포 방식으로 바꿨다.
# 공개 저장소는 gh-pages 브랜치가 생기면 Pages 가 자동으로 켜지는 것이 보통이고,
# 안 켜지면 Settings → Pages → Source: Deploy from a branch (gh-pages) 를 한 번 고르면 된다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true

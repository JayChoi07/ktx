name: pages

# docs/ 폴더(설치 안내 페이지)를 GitHub Pages 로 배포한다.
on:
  push:
    branches: [main]  # 경로 필터 없음: 새 브랜치의 첫 푸시에서는 paths 필터가 동작하지 않아 배포가 안 된다
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true  # 저장소 설정에서 Pages 를 따로 켜지 않아도 되게
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
